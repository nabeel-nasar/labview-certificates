<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Certificate Verification</title>

<style>
  body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;

    /* softer near-white background */
    background: linear-gradient(135deg, #f8f9fb, #eef1f5);
    overflow-x: hidden;
  }

  /* subtle red glow to match logo */
  body::before {
    content: "";
    position: absolute;
    width: 500px;
    height: 500px;
    background: rgba(220, 38, 38, 0.12);
    filter: blur(120px);
    top: -120px;
    left: -120px;
    z-index: 0;
  }

  .header {
    text-align: center;
    padding: 40px 20px 10px;
    z-index: 1;
  }

  .header img {
    width: 120px;
    filter: drop-shadow(0 8px 18px rgba(0,0,0,0.12));
  }

  .header h2 {
    margin: 10px 0 0;
    font-weight: 700;
    color: #b91c1c; /* red tone */
  }

  .header h3 {
    margin: 5px 0 0;
    font-weight: 500;
    color: #444;
  }

  .card {
    margin-top: 30px;
    width: 90%;
    max-width: 540px;
    padding: 30px;
    border-radius: 18px;

    background: rgba(255,255,255,0.75);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    border: 1px solid rgba(0,0,0,0.06);
    box-shadow: 0 18px 50px rgba(0,0,0,0.08);

    position: relative;
    z-index: 1;
    color: #111;
    overflow: hidden;
  }

  /* faint watermark */
  .card::after {
    content: "VERIFIED";
    position: absolute;
    font-size: 80px;
    font-weight: bold;
    color: rgba(185, 28, 28, 0.05);
    transform: rotate(-25deg);
    top: 40%;
    left: 10%;
  }

  .ribbon {
    position: absolute;
    top: 15px;
    right: -40px;
    background: #b91c1c;
    color: white;
    padding: 8px 50px;
    transform: rotate(35deg);
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 1px;
  }

  h1 {
    text-align: center;
    margin-top: 0;
    color: #111;
  }

  .status {
    background: #b91c1c;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 12px;
    margin-left: 8px;
    color: white;
  }

  .row {
    display: flex;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid rgba(0,0,0,0.08);
  }

  .label {
    font-weight: 600;
    color: #555;
  }

  .value {
    font-weight: 600;
    color: #111;
  }

</style>
</head>

<body>

  <div class="header">
    <img src="university-logo.png" alt="University Logo">
    <h2>College of Engineering</h2>
    <h3>Department of Mechanical Engineering</h3>
  </div>

  <div class="card">
    <div class="ribbon">OFFICIAL</div>

    <h1>
      Certificate Verification
      <span class="status">VALID</span>
    </h1>

    <div class="row">
      <div class="label">Certificate ID</div>
      <div class="value">LV-2026-003</div>
    </div>

    <div class="row">
      <div class="label">Student</div>
      <div class="value">Nimra Nadeem</div>
    </div>

    <div class="row">
      <div class="label">Course</div>
      <div class="value">Introduction to LabVIEW</div>
    </div>

    <div class="row">
      <div class="label">Status</div>
      <div class="value">VALID</div>
    </div>

    <div class="row">
      <div class="label">Date Issued</div>
      <div class="value">June 1st, 2026</div>
    </div>

  </div>

</body>
</html>
