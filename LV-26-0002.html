<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Certificate Verification</title>

<style>
  body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: radial-gradient(circle at top, #dbeafe, #0f172a);
    overflow-x: hidden;
  }

  /* soft glowing background effect */
  body::before {
    content: "";
    position: absolute;
    width: 600px;
    height: 600px;
    background: rgba(59,130,246,0.25);
    filter: blur(120px);
    top: -100px;
    left: -100px;
    z-index: 0;
  }

  .header {
    text-align: center;
    padding: 40px 20px 10px;
    z-index: 1;
    color: white;
  }

  .header img {
    width: 120px;
    filter: drop-shadow(0 8px 20px rgba(0,0,0,0.3));
  }

  .header h2 {
    margin: 10px 0 0;
    font-weight: 600;
  }

  .header h3 {
    margin: 5px 0 0;
    font-weight: 400;
    opacity: 0.85;
  }

  .card {
    margin-top: 30px;
    width: 90%;
    max-width: 540px;
    padding: 30px;
    border-radius: 18px;

    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    border: 1px solid rgba(255,255,255,0.25);
    box-shadow: 0 25px 60px rgba(0,0,0,0.35);

    position: relative;
    z-index: 1;
    color: white;
    overflow: hidden;
  }

  /* watermark */
  .card::after {
    content: "VERIFIED";
    position: absolute;
    font-size: 80px;
    font-weight: bold;
    color: rgba(255,255,255,0.05);
    transform: rotate(-25deg);
    top: 40%;
    left: 10%;
  }

  .ribbon {
    position: absolute;
    top: 15px;
    right: -40px;
    background: #22c55e;
    color: white;
    padding: 8px 50px;
    transform: rotate(35deg);
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 1px;
  }

  h1 {
    text-align: center;
    margin-top: 0;
  }

  .status {
    background: #22c55e;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 12px;
    margin-left: 8px;
  }

  .row {
    display: flex;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid rgba(255,255,255,0.15);
  }

  .label {
    opacity: 0.8;
    font-weight: 500;
  }

  .value {
    font-weight: 600;
  }

  .footer {
    text-align: center;
    margin-top: 20px;
    font-size: 12px;
    opacity: 0.7;
  }

</style>
</head>

<body>

  <div class="header">
    <img src="university-logo.png" alt="University Logo">
    <h2>College of Engineering</h2>
    <h3>Department of Mechanical Engineering</h3>
  </div>

  <div class="card">
    <div class="ribbon">OFFICIAL</div>

    <h1>
      Certificate Verification
      <span class="status">VALID</span>
    </h1>

    <div class="row">
      <div class="label">Certificate ID</div>
      <div class="value">LV-2026-001</div>
    </div>

    <div class="row">
      <div class="label">Student</div>
      <div class="value">Student 1</div>
    </div>

    <div class="row">
      <div class="label">Course</div>
      <div class="value">Introduction to LabVIEW</div>
    </div>

    <div class="row">
      <div class="label">Status</div>
      <div class="value">VALID</div>
    </div>

    <div class="row">
      <div class="label">Date Issued</div>
      <div class="value">June 1st, 2026</div>
    </div>

    <div class="footer">
      Verified through secure university registry system
    </div>
  </div>

</body>
</html>
